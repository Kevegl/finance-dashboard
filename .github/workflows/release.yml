# Wird ein Release auf GitHub veröffentlicht (Tag v1.2.3, muss zu app/VERSION passen), entstehen automatisch:
#   - Docker-Image ghcr.io/<owner>/finance-dashboard:<version> und :latest (amd64 + arm64)
#   - FinanzDashboard-<version>-windows-x64.zip (.exe) und -macos-arm64.zip (.app) als Release-Dateien
# Von Hand gestartet (workflow_dispatch) wird nur gebaut und getestet, nichts veröffentlicht.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write    # Dateien ans Release hängen
  packages: write    # Docker-Image in die GitHub Container Registry

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version prüfen
        run: |
          VERSION=$(tr -d '[:space:]' < app/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v$VERSION" ]; then
            echo "::error::Tag ${{ github.event.release.tag_name }} passt nicht zu app/VERSION ($VERSION) – erwartet v$VERSION"
            exit 1
          fi

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-dashboard
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  apps:
    needs: verify
    name: Programm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller installieren (nur zum Bauen)
        run: python -m pip install pyinstaller==6.11.1
      - id: build
        name: Bauen
        run: python packaging/build_app.py
      - name: Kurztest der gebauten Version
        run: python tests/smoke_local.py -- "${{ steps.build.outputs.exe }}"
      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.zip }}" --clobber
      - name: Als Artefakt ablegen (Testlauf)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FinanzDashboard-${{ runner.os }}
          path: ${{ steps.build.outputs.zip }}
